name: "Bug"
description: "Something on the storefront is broken or behaving incorrectly."
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Do not include secrets, tokens, or customer PII. Use exact URLs/SKUs/handles — do not guess."
  - type: input
    id: controlling-record
    attributes:
      label: Controlling record (email / Monday item)
      description: What authorized this work?
    validations:
      required: false
  - type: textarea
    id: what-happened
    attributes:
      label: What's wrong
      description: Actual vs expected behavior.
    validations:
      required: true
  - type: textarea
    id: where
    attributes:
      label: Where (exact URLs / SKUs / handles / templates)
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Include device/browser and desktop vs mobile.
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options: ["S1 - live customer-facing / checkout impacting", "S2 - major", "S3 - minor", "S4 - cosmetic"]
    validations:
      required: true
  - type: input
    id: implementer
    attributes:
      label: Proposed implementer
  - type: input
    id: approver
    attributes:
      label: Approval owner
