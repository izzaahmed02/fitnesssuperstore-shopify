name: "Emergency fix"
description: "Urgent production issue needing an expedited change. Still requires issue/PR, evidence, rollback, and post-release review."
labels: ["emergency"]
body:
  - type: markdown
    attributes:
      value: "Emergencies do NOT waive the workflow. An issue/PR, evidence, a rollback plan, and a post-release review are still required."
  - type: textarea
    id: impact
    attributes:
      label: Live impact
      description: What is broken in production and who/what it affects (checkout, revenue, legal/customer-facing).
    validations:
      required: true
  - type: textarea
    id: fix
    attributes:
      label: Proposed fix + exact files
    validations:
      required: true
  - type: textarea
    id: rollback
    attributes:
      label: Rollback plan (prepared before release)
    validations:
      required: true
  - type: input
    id: implementer
    attributes:
      label: Implementer
    validations:
      required: true
  - type: input
    id: approver
    attributes:
      label: Emergency approver (release owner)
    validations:
      required: true
  - type: checkboxes
    id: post
    attributes:
      label: Post-release
      options:
        - label: Post-release review scheduled
        - label: Production smoke test recorded
