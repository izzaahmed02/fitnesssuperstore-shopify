name: "Feature / change request"
description: "A new storefront feature or an intentional change to existing behavior."
labels: ["feature"]
body:
  - type: input
    id: controlling-record
    attributes:
      label: Controlling record (email / Monday item)
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: Goal / business outcome
    validations:
      required: true
  - type: textarea
    id: scope-in
    attributes:
      label: In scope (exact URLs / SKUs / handles / templates / files)
    validations:
      required: true
  - type: textarea
    id: scope-out
    attributes:
      label: Out of scope
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How we will know it's correct. Include analytics/SEO expectations if relevant.
    validations:
      required: true
  - type: input
    id: implementer
    attributes:
      label: Named implementer
    validations:
      required: true
  - type: input
    id: approver
    attributes:
      label: Named approval owner
    validations:
      required: true
