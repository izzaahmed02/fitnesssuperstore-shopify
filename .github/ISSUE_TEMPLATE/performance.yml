name: "Performance / Core Web Vitals"
description: "PageSpeed, CWV (LCP/CLS/INP), image delivery, or render performance."
labels: ["performance"]
body:
  - type: textarea
    id: metric
    attributes:
      label: Metric / finding
      description: Which metric, measured value, and the tool/run (e.g. PageSpeed, throttled).
    validations:
      required: true
  - type: textarea
    id: where
    attributes:
      label: Where (exact URLs + device)
      description: Representative PDP/collection/homepage, mobile vs desktop.
    validations:
      required: true
  - type: textarea
    id: baseline
    attributes:
      label: Baseline / target
      description: Before/after matrix expectation. Note that live re-runs are required to confirm.
    validations:
      required: true
  - type: input
    id: implementer
    attributes:
      label: Proposed implementer
  - type: input
    id: approver
    attributes:
      label: Approval owner
