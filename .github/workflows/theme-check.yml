name: Theme Check

# Static Liquid/theme lint via Shopify CLI. No store credentials are used or needed.
#
# REPRODUCIBILITY: the Shopify CLI version is PINNED below (THEME_CHECK_CLI_VERSION).
# An unpinned `npm install -g @shopify/cli` makes the result depend on the day the
# job ran. Bump the pin deliberately, in its own PR, and re-attach the report.
#
# ROLLOUT: report-only today, because the theme has a large pre-existing lint
# backlog. Report-only means "findings do not fail the job" — it does NOT mean
# "any outcome passes": a crash or a timeout still fails the job below, so a broken
# run can never be mistaken for a clean one. Once the backlog is triaged and a
# blocking threshold is approved, set REPORT_ONLY to 'false' and make this a
# REQUIRED status check on `main` (see docs/governance-packet.md). Until then it is
# not a quality gate.

on:
  pull_request:
  push:
    branches:
      - main

# Supersede an in-progress run only for a branch push. PR runs are NOT cancelled:
# a cancelled check cannot serve as release evidence for an exact head SHA.
concurrency:
  group: theme-check-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

permissions:
  contents: read

jobs:
  theme-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Pinned tool version — the whole point of this workflow being reproducible.
      THEME_CHECK_CLI_VERSION: '4.5.2'
      # 'false' makes lint findings fail the job. Do not flip without the approved
      # blocking threshold.
      REPORT_ONLY: 'true'
      CI: 'true'
      SHOPIFY_CLI_NO_ANALYTICS: '1'
      SHOPIFY_FLAG_NON_INTERACTIVE: 'true'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pinned Shopify CLI
        run: npm install -g "@shopify/cli@${THEME_CHECK_CLI_VERSION}"

      # Recorded in the log so any attached report states exactly what produced it.
      - name: Record tool versions
        run: |
          echo "commit:          ${GITHUB_SHA}"
          echo "node:            $(node --version)"
          echo "npm:             $(npm --version)"
          echo "@shopify/cli:    $(npm ls -g --depth=0 @shopify/cli | sed -n 's/.*@shopify\/cli@//p')"
          echo "shopify --version: $(shopify version 2>/dev/null || true)"

      # stdin from /dev/null so the linter can never hang CI waiting on a prompt.
      # Exit-code handling: 0/1 = the lint ran (1 = findings). Anything else is a
      # real failure (124 = timed out, i.e. an incomplete report) and fails the job
      # even in report-only mode.
      - name: Run Theme Check
        id: check
        run: |
          set +e
          timeout 1200 shopify theme check --no-color < /dev/null | tee theme-check-report.txt
          status=${PIPESTATUS[0]}
          set -e
          echo "status=${status}" >> "$GITHUB_OUTPUT"

          if [ "$status" -eq 124 ]; then
            echo "::error::Theme Check timed out after 20 minutes — report is incomplete."
            exit 1
          fi
          if [ "$status" -gt 1 ]; then
            echo "::error::Theme Check failed to run (exit ${status})."
            exit "$status"
          fi
          if [ "$status" -eq 1 ]; then
            if [ "${REPORT_ONLY}" = 'true' ]; then
              echo "::warning::Theme Check reported findings. Report-only during rollout — not failing the job. This is not a quality gate."
            else
              echo "::error::Theme Check reported findings and REPORT_ONLY is disabled."
              exit 1
            fi
          fi

      # The report is the attachable evidence for a release packet.
      - name: Upload Theme Check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: theme-check-report-${{ github.sha }}
          path: theme-check-report.txt
          if-no-files-found: warn
          retention-days: 30
