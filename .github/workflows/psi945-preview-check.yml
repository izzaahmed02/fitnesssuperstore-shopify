name: PSI945 preview acceptance evidence
on:
  push:
    branches: ['qa/945-live-verification-2026-10-09']
    paths: ['.github/workflows/psi945-preview-check.yml']
permissions:
  contents: read
jobs:
  preview-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Prepare read-only audit tools
        run: |
          mkdir -p "$RUNNER_TEMP/fss-psi-preview/reports"
          cd "$RUNNER_TEMP/fss-psi-preview"
          npm init -y
          npm install --ignore-scripts --save-exact lighthouse playwright chrome-launcher
          cp package-lock.json reports/audit-package-lock.json
          echo "CHROME_PATH=$(command -v google-chrome || command -v chromium)" >> "$GITHUB_ENV"
      - name: Verify eight source files, shared header and preview audits
        working-directory: ${{ runner.temp }}/fss-psi-preview
        run: |
          cat > preview-check.mjs <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          import crypto from 'node:crypto';
          import {chromium} from 'playwright';
          import lighthouse from 'lighthouse';
          import * as chromeLauncher from 'chrome-launcher';
          import desktopConfig from 'lighthouse/core/config/desktop-config.js';
          const head='042bc87888afa3032d08260e5dc7c5223da4d5cd';
          const id='189052682556';
          const base='https://www.fitnesssuperstore.com';
          const out=path.resolve('reports');fs.mkdirSync(out,{recursive:true});
          const expected={
           'assets/homepage-browse-by-brand.css':['23637bbaa69cefeff340f26d19d46aec',3563],
           'assets/homepage-homepage-reviews.css':['ac2d68e6bc321b8cc7614eccec62d9a1',7911],
           'sections/header.liquid':['629439cb89e65970a40a9f5b1058e4e8',60678],
           'sections/homepage-browse-by-brand.liquid':['8e961a50ce068a3ca9c17bb9fb8e5943',2757],
           'sections/homepage-homepage-offers.liquid':['796cbe4d735798823d7f84653f77a305',2418],
           'sections/homepage-homepage-reviews.liquid':['76d770eeeb801ec80e6f2b8b9399a59f',11902],
           'sections/homepage-popular-fitness.liquid':['56fc793a0b8ad2e2345a9bbbf0b5677c',15602],
           'templates/index.json':['2d1661b5e66814a2963cc451ffdc30e5',32808]
          };
          const data={head,themeId:id,startedAt:new Date().toISOString(),source:[],headers:[],lighthouse:[],errors:[]};
          function save(n,v){fs.writeFileSync(path.join(out,n),JSON.stringify(v,null,2));}
          for(const [file,[md5,size]] of Object.entries(expected)){
           try{const r=await fetch('https://raw.githubusercontent.com/izzaahmed02/fitnesssuperstore-shopify/'+head+'/'+file);if(!r.ok)throw new Error('HTTP '+r.status);const b=Buffer.from(await r.arrayBuffer());const actual=crypto.createHash('md5').update(b).digest('hex');data.source.push({file,expectedMd5:md5,actualMd5:actual,expectedSize:size,actualSize:b.length,pass:actual===md5&&size===b.length});}
           catch(error){data.errors.push({file,stage:'source',error:String(error)});}
          }
          const browser=await chromium.launch({executablePath:process.env.CHROME_PATH,headless:true,args:['--no-sandbox']});
          try{
           for(const route of ['/collections/treadmills','/products/woodway-4front-treadmill-remanufactured'])for(const width of [1440,390]){
            const context=await browser.newContext({viewport:{width,height:900}});const page=await context.newPage();const row={route,width};
            try{const r=await page.goto(base+route+'?preview_theme_id='+id,{waitUntil:'load',timeout:90000});row.status=r?.status();row.finalUrl=page.url();row.theme=await page.evaluate(()=>window.Shopify?.theme||null);row.phoneLinks=await page.locator('a[href^="tel:"]').evaluateAll(as=>as.map(a=>({text:a.innerText.trim(),label:a.getAttribute('aria-label'),href:a.getAttribute('href'),visible:a.getBoundingClientRect().width>0&&a.getBoundingClientRect().height>0})));row.pass=String(row.theme?.id)===id&&row.status===200&&new URL(row.finalUrl).pathname===route&&row.phoneLinks.some(a=>a.visible&&a.href==='tel:+1-925-215-2927');await page.screenshot({path:path.join(out,'header-'+(route.startsWith('/collections')?'collection':'pdp')+'-'+width+'.png')});}
            catch(error){row.error=String(error);row.pass=false;}
            data.headers.push(row);await context.close();
           }
          }finally{await browser.close();}
          for(const device of ['desktop','mobile']){
           const chrome=await chromeLauncher.launch({chromePath:process.env.CHROME_PATH,chromeFlags:['--headless','--no-sandbox']});
           try{
            const result=await lighthouse(base+'/?preview_theme_id='+id,{port:chrome.port,output:'html',logLevel:'error'},device==='desktop'?desktopConfig:undefined);
            if(!result)throw new Error('No Lighthouse result');
            const lhr=result.lhr;save(device+'.report.json',lhr);fs.writeFileSync(path.join(out,device+'.report.html'),result.report);
            const html=result.artifacts.MainDocumentContent||'';fs.writeFileSync(path.join(out,device+'.main-document.html'),html);
            if(result.artifacts.Trace)save(device+'.trace.json',result.artifacts.Trace);
            if(result.artifacts.DevtoolsLog)save(device+'.devtoolslog.json',result.artifacts.DevtoolsLog);
            let theme=null;const match=/Shopify\.theme\s*=\s*(\{[^;]+\})\s*;/.exec(html);if(match){try{theme=JSON.parse(match[1]);}catch{}}
            const row={device,fetchTime:lhr.fetchTime,lighthouseVersion:lhr.lighthouseVersion,settings:lhr.configSettings,requestedUrl:lhr.requestedUrl,finalUrl:lhr.finalDisplayedUrl,servedTheme:theme,themeMatches:String(theme?.id)===id,scores:Object.fromEntries(Object.entries(lhr.categories).map(([k,v])=>[k,v.score===null?null:v.score*100])),runtimeError:lhr.runtimeError||null,warnings:lhr.runWarnings||[],targetAudits:Object.fromEntries(Object.entries(lhr.audits).filter(([k,v])=>/aria|accessib|heading|contrast|link-text|unsized|agentic|tree/.test(k)).map(([k,v])=>[k,{title:v.title,score:v.score,scoreDisplayMode:v.scoreDisplayMode,details:v.details}]))};data.lighthouse.push(row);
           }catch(error){data.errors.push({device,stage:'preview-lighthouse',error:String(error)});}
           finally{await chrome.kill();}
          }
          data.finishedAt=new Date().toISOString();save('preview-evidence.json',data);
          console.log('PREVIEW_SUMMARY '+JSON.stringify(data));
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY||path.join(out,'summary.md'),'## Exact-head preview verification\n\n```json\n'+JSON.stringify(data,null,2)+'\n```\n');
          if(data.errors.length||data.source.length!==8||data.source.some(r=>!r.pass)||data.headers.some(r=>!r.pass)||data.lighthouse.length!==2||data.lighthouse.some(r=>!r.themeMatches||r.runtimeError))process.exitCode=1;
          JS
          node preview-check.mjs
      - name: Retain raw acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: psi945-preview-acceptance-042bc878
          path: ${{ runner.temp }}/fss-psi-preview/reports/
          retention-days: 14
          if-no-files-found: error
