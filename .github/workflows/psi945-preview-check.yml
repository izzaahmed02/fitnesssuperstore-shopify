name: PSI945 preview acceptance evidence
on:
  push:
    branches: ['qa/945-live-verification-2026-10-09']
    paths: ['.github/workflows/psi945-preview-check.yml']
permissions:
  contents: read
jobs:
  preview-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Prepare read-only audit tools and pin MAIN
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/fss-psi-preview/reports"
          cd "$RUNNER_TEMP/fss-psi-preview"
          npm init -y
          npm install --ignore-scripts --save-exact lighthouse@13.5.0 playwright@1.64.0 chrome-launcher axe-core@4.14.0
          cp package-lock.json reports/audit-package-lock.json
          echo "CHROME_PATH=$(command -v google-chrome || command -v chromium)" >> "$GITHUB_ENV"
          echo "MAIN_SHA_BEFORE=$(gh api repos/izzaahmed02/fitnesssuperstore-shopify/git/ref/heads/main --jq .object.sha)" >> "$GITHUB_ENV"
      - name: Reuse the reviewed immutable test harness at the final source head
        working-directory: ${{ runner.temp }}/fss-psi-preview
        run: |
          curl --fail --silent --show-error --location 'https://raw.githubusercontent.com/izzaahmed02/fitnesssuperstore-shopify/bc65c8558c55bc2d0668f25e05b775c8df7263cb/.github/workflows/psi945-preview-check.yml' -o reviewed-harness.yml
          python - <<'PY'
          from pathlib import Path
          source=Path('reviewed-harness.yml').read_text()
          marker="          cat > preview-check.mjs <<'JS'\n"
          start=source.index(marker)+len(marker)
          end=source.index('          JS\n',start)
          script='\n'.join(line[10:] for line in source[start:end].splitlines())+'\n'
          replacements={
            'c1f8417da28572b9b5200b9a62bf6e4098642ee4':'93fe0b75793900b9437f26fe585fa03b948a00c9',
            "'23637bbaa69cefeff340f26d19d46aec',3563":"'468007d983e463746a9d98d027bde4a0',3665",
            "const link=page.locator('.homepage-browse-brand .slick-active a[href]').first();await link.focus();":"const link=page.locator('.homepage-browse-brand .slick-active a[href]').first();await link.focus();await page.keyboard.press('Tab');await page.keyboard.press('Shift+Tab');",
            'row.keyboardNext.pass&&row.focus.focused&&':"row.keyboardNext.pass&&row.focus.focused&&row.focus.outline==='solid'&&parseFloat(row.focus.outlineWidth)>=3&&"
          }
          for old,new in replacements.items():
            assert script.count(old)==1, 'Unexpected immutable harness content: '+old
            script=script.replace(old,new)
          Path('preview-check.mjs').write_text(script)
          Path('reports/executed-preview-check.mjs').write_text(script)
          PY
          node --check preview-check.mjs
          node preview-check.mjs
      - name: Verify MAIN was not changed during final checks
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          AFTER=$(gh api repos/izzaahmed02/fitnesssuperstore-shopify/git/ref/heads/main --jq .object.sha)
          printf 'MAIN before: %s\nMAIN after: %s\n' "$MAIN_SHA_BEFORE" "$AFTER" | tee "$RUNNER_TEMP/fss-psi-preview/reports/main-ref-guard.txt"
          test "$MAIN_SHA_BEFORE" = "$AFTER"
      - name: Retain raw acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: psi945-preview-acceptance-93fe0b75
          path: ${{ runner.temp }}/fss-psi-preview/reports/
          retention-days: 14
          if-no-files-found: error
