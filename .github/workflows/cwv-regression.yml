name: CWV Regression Checks

on:
  push:
    branches:
      - '**'
  pull_request:

jobs:
  cwv-regression:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run CWV regression script
        run: python scripts/cwv_regression_test.py
