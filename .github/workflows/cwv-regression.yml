name: Publish direct PR787 Shopify archive

on:
  push:
    branches:
      - 'ai/package-pr787-preview-2026-09-03'

permissions:
  contents: write

jobs:
  publish-direct-archive:
    runs-on: ubuntu-latest
    steps:
      - name: Check out packaging branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify theme tree is identical to exact source SHA
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA='79632e18698eaf396f267457bbc5e47e04996c13'
          git cat-file -e "$SOURCE_SHA^{commit}"
          git diff --quiet "$SOURCE_SHA" -- assets config layout locales sections snippets templates
          echo "Verified theme directories are identical to $SOURCE_SHA"

      - name: Build archive and checksum manifest
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA='79632e18698eaf396f267457bbc5e47e04996c13'
          ARCHIVE='theme-pr787-79632e1.zip'
          MANIFEST='manifest-pr787-79632e1.txt'

          rm -rf theme-package "$ARCHIVE" "$MANIFEST"
          mkdir theme-package
          cp -R assets config layout locales sections snippets templates theme-package/
          (
            cd theme-package
            zip -qr "../$ARCHIVE" .
          )

          {
            echo 'Fitness Superstore Shopify Preview Package'
            echo "Exact source SHA: $SOURCE_SHA"
            echo "Packaging workflow commit: $GITHUB_SHA"
            echo 'Scope: complete theme snapshot at the exact source SHA; candidate differs from main in 13 approved files.'
            echo
            echo 'MD5 checksums for the 13 approved changed files:'
            for file in \
              assets/facets-product-index.js \
              sections/homepage-popular-fitness.liquid \
              sections/main-product-comb.liquid \
              sections/main-product-home-gym-packages.liquid \
              sections/main-product-variants.liquid \
              sections/main-product.liquid \
              snippets/homepage-product-items-home.liquid \
              snippets/product-add-ons.liquid \
              snippets/product-item.liquid \
              snippets/product-items-home.liquid \
              snippets/related-items-colln.liquid \
              snippets/related-items.liquid \
              snippets/super-sale.liquid
            do
              md5sum "$file"
            done
          } > "$MANIFEST"

          unzip -t "$ARCHIVE"
          cat "$MANIFEST"

      - name: Publish temporary direct-download branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ARCHIVE_BRANCH='ai/theme-archive-pr787-79632e1'
          ARCHIVE='theme-pr787-79632e1.zip'
          MANIFEST='manifest-pr787-79632e1.txt'
          WORKDIR="$(mktemp -d)"

          cp "$ARCHIVE" "$MANIFEST" "$WORKDIR/"
          cd "$WORKDIR"
          git init
          git checkout -b "$ARCHIVE_BRANCH"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$ARCHIVE" "$MANIFEST"
          git commit -m 'chore: temporary exact-SHA Shopify preview archive'
          gh auth setup-git
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git push --force origin "HEAD:refs/heads/$ARCHIVE_BRANCH"
